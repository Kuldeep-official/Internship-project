<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysslan Events | Feedback System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animation for the background shapes */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        /* The secret sauce: Backdrop blur for Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<div id="successPopup" class="fixed inset-0 flex items-center justify-center z-[100] hidden">
    <div class="glass-card p-10 rounded-3xl shadow-2xl text-center border border-white/40 max-w-sm transform scale-95 transition-transform duration-300">
        <div class="w-20 h-20 bg-teal-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-teal-500/40">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h3 class="text-2xl font-black text-gray-900 mb-2">Sent!</h3>
        <p class="text-gray-600 mb-6">Your feedback is now live on the dashboard.</p>
        <button onclick="closePopup()" class="bg-gray-900 text-white px-8 py-2 rounded-full font-bold hover:bg-gray-800 transition">Awesome</button>
    </div>
</div>

<body class="min-h-screen bg-gradient-to-br from-orange-400 via-rose-400 to-amber-300 font-sans text-gray-800">

    <div class="fixed top-20 left-10 w-64 h-64 bg-white/20 rounded-full blur-3xl animate-float"></div>
    <div class="fixed bottom-20 right-10 w-96 h-96 bg-orange-200/30 rounded-full blur-3xl animate-float" style="animation-delay: 2s;"></div>

    <nav class="glass-nav p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-orange-600 tracking-tighter">SYSSLAN <span class="text-gray-900">EVENTS</span></h1>
            <div class="space-x-8 font-semibold text-gray-700">
                <a href="#" class="hover:text-orange-600 transition">Home</a>
                <a href="#feedback-section" class="hover:text-orange-600 transition">Feedback</a>
            </div>
        </div>
    </nav>

    <section id="feedback-section" class="relative max-w-2xl mx-auto py-20 px-4">
        <div class="glass-card p-10 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <h2 class="text-4xl font-black text-gray-900 mb-2">Your Voice Matters</h2>
                <p class="text-gray-600">Help us craft better experiences, one event at a time.</p>
            </div>

            <form id="feedbackForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Full Name</label>
                    <input type="text" id="userName" placeholder="e.g. Kuldeep C." required 
                     autocomplete="off" 
                     class="w-full p-4 bg-white/50 border border-white/50 rounded-2xl focus:ring-4 focus:ring-orange-500/20 focus:outline-none transition placeholder-gray-400">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Event Name</label>
                    <select id="eventName" required 
                        class="w-full p-4 bg-white/50 border border-white/50 rounded-2xl focus:ring-4 focus:ring-orange-500/20 focus:outline-none transition">
                        <option value="">Select an Event</option>
                        <option value="Tech Summit 2026">Tech Summit 2026</option>
                        <option value="AI Workshop">AI Workshop</option>
                        <option value="Networking Night">Networking Night</option>
                        <option value="Database Bashing">Database Bashing</option>
                        <option value="Tech Stack ">Tech Stack</option>
                        <option value="Binary Brews">Binary Brews</option>
                        <option value="Blockchain Boldness">Blockchain Boldness</option>


                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Feedback Message</label>
                    <textarea id="userMessage" placeholder="What did you think?" required 
                        class="w-full p-4 bg-white/50 border border-white/50 rounded-2xl h-40 focus:ring-4 focus:ring-orange-500/20 focus:outline-none transition placeholder-gray-400"></textarea>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-orange-600 to-rose-600 text-white font-black py-4 rounded-2xl shadow-lg hover:shadow-orange-500/30 hover:scale-[1.02] active:scale-95 transition-all duration-200 uppercase tracking-widest">
                    Submit Feedback
                </button>
            </form>
        </div>
    </section>


    <script src="script.js"></script>
</body>
</html>
